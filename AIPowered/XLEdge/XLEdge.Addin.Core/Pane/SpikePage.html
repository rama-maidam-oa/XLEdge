<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLEdge</title>
<style>
  body { font-family: "Segoe UI", sans-serif; font-size: 13px; margin: 16px; color: #1f1f1f; background: #ffffff; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 16px; }
  dt { color: #616161; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  label { display: block; margin: 12px 0 4px; color: #616161; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #c7c7c7; border-radius: 4px; }
  button { margin-top: 8px; padding: 6px 14px; font: inherit; border: 1px solid #c7c7c7; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #0f6cbd; outline-offset: 1px; }
</style>
</head>
<body>
<h1>XLEdge pane spike</h1>
<dl>
  <dt>Core version</dt><dd id="version">{{VERSION}}</dd>
  <dt>Pane size</dt><dd id="size"></dd>
  <dt>Device pixel ratio</dt><dd id="dpr"></dd>
  <dt>Last command</dt><dd id="last">ready</dd>
</dl>
<label for="text">Keyboard check: type here</label>
<input id="text" autocomplete="off">
<button id="ping" type="button">Send ping to the core</button>
<label for="url">Open a page (for example the XLEdge login URL)</label>
<input id="url" type="url" placeholder="https://">
<button id="go" type="button">Open</button>
<script>
  // The core watches document.title: "xledge:<command>" is the title command bus today's XLEdge pane uses.
  function send(command) { document.title = "xledge:" + command; document.getElementById("last").textContent = command; }
  function measure() {
    document.getElementById("size").textContent = window.innerWidth + " x " + window.innerHeight + " CSS px";
    document.getElementById("dpr").textContent = window.devicePixelRatio;
  }
  window.addEventListener("resize", measure);
  document.getElementById("ping").addEventListener("click", function () { send("ping:" + Date.now()); });
  document.getElementById("go").addEventListener("click", function () {
    var url = document.getElementById("url").value.trim();
    if (/^https?:\/\//i.test(url)) window.location.href = url;
  });
  document.getElementById("url").addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("go").click(); });
  measure();
  send("ready");
</script>
</body>
</html>
